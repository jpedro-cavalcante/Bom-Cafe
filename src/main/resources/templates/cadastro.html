<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Criar Conta — Bom Café</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <script th:src="@{/js/script.js}"></script>
    <header th:replace="~{fragments :: header('cadastro')}"></header>

    <section class="section">
        <div class="container">
            <div class="card form-card">
                <div style="text-align:center">
                    <div class="brand-mark" style="margin:auto">☕</div>
                    <h1 style="margin-top:18px">Criar Conta</h1>
                    <p class="prose">Junte-se ao Bom Café e acompanhe nossas seleções e histórias.</p>
                </div>
                <form th:action="@{/cadastro}" th:object="${usuario}" method="post">
                    <div class="field"><label>Nome completo</label><input th:field="*{nome}" required autocomplete="name"></div>
                    <div class="field"><label>E-mail</label><input th:field="*{email}" type="email" required autocomplete="email"></div>
                    <div class="field"><label>Senha</label><input th:field="*{senha}" id="senhaCadastro" type="password" required
                            autocomplete="new-password"></div>
                    <div class="field"><label>Confirmar senha</label><input id="confirmarCadastro" type="password"
                            required autocomplete="new-password"></div>
                    <label class="check"><input type="checkbox" required><span>Li e aceito os termos de uso e a política
                            de privacidade do Bom Café.</span></label>
                    <button class="btn btn-primary" type="submit" style="width:100%;margin-top:18px">Criar
                        Conta</button>
                </form>
                <div style="text-align:center;margin:24px 0;color:#766e65">ou</div>
                <button class="btn btn-outline" style="width:100%"
                    onclick="toast('Cadastro com Google selecionado.')">Continuar com Google</button>
                <p style="text-align:center;margin-top:24px">Já tem uma conta? <a th:href="@{/login}"
                        style="font-weight:700">Entrar</a></p>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments :: footer}"></footer>
    <div id="toast" class="toast"></div>
    <div th:replace="~{fragments :: alerts}"></div>
</body>

</html>
